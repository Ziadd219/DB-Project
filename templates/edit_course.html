<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Course</title>
</head>
<body>
    <h1>Edit Course</h1>
    <a href="/courses">Back to Course List</a>
    <br><br>
    <form method="POST" action="/update_course/{{ course[0] }}">
        <label>Course Code:</label>
        <input type="text" name="course_code" value="{{ course[1] }}" maxlength="20" required><br><br>

        <label>Course Name:</label>
        <input type="text" name="course_name" value="{{ course[2] }}" maxlength="100" required><br><br>

        <label>Credits:</label>
        <input type="number" name="credits" value="{{ course[3] }}" min="1" step="1" required><br><br>

        <label>Department:</label>
        <input type="text" name="department" value="{{ course[4] }}" maxlength="50" required><br><br>

        <button type="submit">Update Course</button>
    </form>
</body>
</html>
