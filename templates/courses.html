<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses</title>
</head>
<body>
    <h1>Courses</h1>
    <a href="/">Back to Home</a>

    <h2>Add Course</h2>

    <form action="/add_course" method="POST">
        <label>Course Code:</label>
        <input type="text" name="course_code" maxlength="20" required><br><br>

        <label>Course Name:</label>
        <input type="text" name="course_name" maxlength="100" required><br><br>

        <label>Credits:</label>
        <input type="number" name="credits" min="1" step="1" required><br><br>

        <label>Department:</label>
        <input type="text" name="department" maxlength="50" required><br><br>

        <button type="submit">Add Course</button>
    </form>

    <hr>

    <h2>Search Courses</h2>
    <form action="/courses" method="GET">
        <input type="text" name="search" placeholder="Search courses..." value="{{ search }}">
        <button type="submit">Search</button>
        <a href="/courses">Show All</a>
    </form>

    <hr>

    <h2>Course List</h2>


    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>Course Code</th>
            <th>Course Name</th>
            <th>Credits</th>
            <th>Department</th>
            <th>Actions</th>
        </tr>

        {% for course in courses %}
        <tr>
            <td>{{ course[0] }}</td>
            <td>{{ course[1] }}</td>
            <td>{{ course[2] }}</td>
            <td>{{ course[3] }}</td>
            <td>{{ course[4] }}</td>
            <td>
                <a href="/edit_course/{{ course[0] }}">Edit</a>
                <form action="/delete_course/{{ course[0] }}" method="POST" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this course?');">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
