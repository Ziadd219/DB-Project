<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
</head>
<body>
    <h1>Edit Student</h1>
    <a href="/students">Back to Students</a>
    <br><br>
    <form method="POST" action="/update_student/{{ student[0] }}">
        <label>First Name:</label>
        <input type="text" name="first_name" value="{{ student[1] }}" maxlength="50" required><br><br>

        <label>Last Name:</label>
        <input type="text" name="last_name" value="{{ student[2] }}" maxlength="50" required><br><br>

        <label>Email:</label>
        <input type="email" name="email" value="{{ student[3] }}" maxlength="100" required><br><br>

        <label>Department:</label>
        <input type="text" name="department" value="{{ student[4] }}" maxlength="50" required><br><br>

        <button type="submit">Save Changes</button>
    </form>
</body>
</html>
