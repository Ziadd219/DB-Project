<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students</title>
</head>
<body>
    <h1>Students</h1>
    <a href="/">Back to Home</a>

    <h2>Add Student</h2>
    <form action="/add_student" method="POST">
        <label for="first_name">First Name:</label>
        <input type="text" name="first_name" maxlength="50" required><br><br>

        <label for="last_name">Last Name:</label>
        <input type="text" name="last_name" maxlength="50" required><br><br>

        <label for="email">Email:</label>
        <input type="email" name="email" maxlength="100" required><br><br>

        <label for="department">Department:</label>
        <input type="text" name="department" maxlength="50" required><br><br>

        <button type="submit">Add Student</button>
    </form>

    <h2>Search Students</h2>
    <form action="/students" method="GET">
        <input type="text" name="search" placeholder="Search students..." value="{{ search }}">
        <button type="submit">Search</button>
        <a href="/students">Show All</a>
    </form>

    <hr>

    <h2>Student List</h2>

    <table border="1" cellpadding="8">
        <tr>
            <th>ID</th>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>Actions</th>
        </tr>

        {% for student in students %}
        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>{{ student[4] }}</td>
            <td>
                <a href="/edit_student/{{ student[0] }}">Edit</a>

                <form action="/delete_student/{{ student[0] }}" method="POST" style="display:inline;">
                    <button type="submit" onclick="return confirm('Are you sure you want to delete this student?');">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
